plugins {
    id 'com.android.application'
}

def releaseStorePath = System.getenv('MHR_RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('MHR_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('MHR_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('MHR_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace = 'com.example.voward'
    compileSdk = 36

    defaultConfig {
        // Preserve the original install identity so existing installs, IDE launch
        // configurations, and on-device data continue to resolve correctly.
        applicationId = "com.example.voward"
        minSdk = 26
        targetSdk = 36
        versionCode = 11007
        versionName = "1.10.7"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile = rootProject.file(releaseStorePath)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            enableUnitTestCoverage = true
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig = signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

}
